<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vespera - Twilight Phoenix Valkyrie</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #080312;
            font-family: 'Consolas', monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px #000;
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            font-size: 13px;
            line-height: 1.7;
            pointer-events: none;
            background: rgba(18, 10, 28, 0.85);
            padding: 14px 18px;
            border-radius: 6px;
            border: 2px solid #581c87;
        }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fce7f3;
            text-shadow: 1px 1px 2px #000;
            font-size: 13px;
            background: rgba(18, 10, 28, 0.88);
            padding: 10px 22px;
            border-radius: 6px;
            border: 1px solid #701a75;
            pointer-events: none;
            text-align: center;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(8, 3, 18, 0.82);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 10;
        }
        #blocker h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #f472b6;
            text-shadow: 0 0 12px #ec4899, 2px 2px 0 #3b0764;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="blocker">
        <h1>CLICK TO START</h1>
        <p style="color: #fbcfe8;">Controls: WASD | Shift to Sprint | Left Click to Strike | V for View</p>
    </div>
    <div id="crosshair"></div>
    <div id="ui">
        <div><b>CAMERA:</b> <span id="cam-mode" style="color:#f472b6;">3rd Person [V]</span></div>
        <div><b>ACTION:</b> <span id="anim-state">IDLE</span></div>
        <div><b>TERRAIN:</b> <span id="water-state">Dry Land</span></div>
    </div>
    <div id="instructions">
        [W,A,S,D] Move | [SPACE] Jump/Float | [SHIFT] Sprint | [L-CLICK] Swing Pickaxe | [V] Camera View
    </div>
    <div id="canvas-container"></div>

    <script>
        /* -------------------------------------------------------------
           PROCEDURAL TEXTURES - TWILIGHT PHOENIX VALKYRIE (VESPERA)
        ------------------------------------------------------------- */
        const TextureGen = {
            createCanvas(w, h) {
                const cv = document.createElement('canvas');
                cv.width = w; cv.height = h;
                return cv;
            },
            createPixelTexture(cv) {
                const tex = new THREE.CanvasTexture(cv);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                return tex;
            },
            addNoise(ctx, w, h, factor = 0.08) {
                const img = ctx.getImageData(0, 0, w, h);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const n = (Math.random() - 0.5) * factor * 255;
                    d[i] = Math.min(255, Math.max(0, d[i] + n));
                    d[i+1] = Math.min(255, Math.max(0, d[i+1] + n));
                    d[i+2] = Math.min(255, Math.max(0, d[i+2] + n));
                }
                ctx.putImageData(img, 0, 0);
            },
            createFaceTexture() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                
                // Fair Porcelain Skin with Warm Rosy Undertone
                ctx.fillStyle = '#fce7f3';
                ctx.fillRect(0, 0, 16, 16);

                // Deep Twilight Violet & Orchid Front Bangs
                ctx.fillStyle = '#3b0764';
                ctx.fillRect(0, 0, 16, 3);
                ctx.fillStyle = '#a21caf';
                ctx.fillRect(0, 2, 4, 3);
                ctx.fillRect(12, 2, 4, 3);
                ctx.fillRect(4, 2, 2, 2);
                ctx.fillRect(10, 2, 2, 2);
                
                // Luminous Platinum-Pink Highlight Strands
                ctx.fillStyle = '#f472b6';
                ctx.fillRect(2, 1, 3, 1);
                ctx.fillRect(11, 1, 3, 1);

                // Eyelashes & Upper Eyelid
                ctx.fillStyle = '#2e1065';
                ctx.fillRect(2, 5, 4, 1);
                ctx.fillRect(10, 5, 4, 1);

                // Right Eye: Radiant Phoenix-Magenta Iris + Starlight Glint
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(2, 6, 4, 3);
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(3, 6, 2, 2);
                ctx.fillStyle = '#fb7185';
                ctx.fillRect(4, 6, 1, 1);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(3, 6, 1, 1);

                // Left Eye: Ethereal Twilight Violet Iris + Astral Glint
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(10, 6, 4, 3);
                ctx.fillStyle = '#8b5cf6';
                ctx.fillRect(11, 6, 2, 2);
                ctx.fillStyle = '#c084fc';
                ctx.fillRect(12, 6, 1, 1);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(11, 6, 1, 1);

                // Phoenix Wing Feather Warpaint / Arcane Mark below left eye
                ctx.fillStyle = '#e879f9';
                ctx.fillRect(13, 9, 2, 3);
                ctx.fillRect(11, 10, 2, 1);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(12, 11, 2, 2);

                // Soft Cheeks Blush
                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(2, 9, 2, 1);

                // Elegant Soft Rosy Lips
                ctx.fillStyle = '#e11d48';
                ctx.fillRect(6, 12, 4, 1);
                ctx.fillStyle = '#fda4af';
                ctx.fillRect(7, 12, 2, 1);

                this.addNoise(ctx, 16, 16, 0.03);
                return this.createPixelTexture(cv);
            },
            createHairTexture() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                
                // Gradient Twilight Violet to Deep Rose-Plum
                ctx.fillStyle = '#2e1065';
                ctx.fillRect(0, 0, 16, 16);
                ctx.fillStyle = '#581c87';
                ctx.fillRect(2, 2, 12, 12);
                ctx.fillStyle = '#86198f';
                ctx.fillRect(4, 4, 8, 8);
                ctx.fillStyle = '#c026d3';
                ctx.fillRect(5, 5, 6, 6);
                
                // Radiant Streaks
                ctx.fillStyle = '#f472b6';
                ctx.fillRect(2, 6, 2, 8);
                ctx.fillRect(12, 6, 2, 8);

                this.addNoise(ctx, 16, 16, 0.05);
                return this.createPixelTexture(cv);
            },
            createTorsoTexture() {
                const cv = this.createCanvas(16, 24);
                const ctx = cv.getContext('2d');

                // Midnight Draconic Silk & Velvet Base
                ctx.fillStyle = '#0f051d';
                ctx.fillRect(0, 0, 16, 24);

                // Exposed Fair Decolletage
                ctx.fillStyle = '#fce7f3';
                ctx.fillRect(4, 0, 8, 4);

                // Ornate Rose-Gold / Crimson Filigree Corsetry
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(2, 4, 12, 2);
                ctx.fillRect(1, 6, 3, 12);
                ctx.fillRect(12, 6, 3, 12);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(2, 5, 12, 1);

                // Amethyst & Velvet Bodice Inlay
                ctx.fillStyle = '#4c0519';
                ctx.fillRect(4, 6, 8, 11);

                // Pulsing Phoenix Heart Ember (Chest Jewel)
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(6, 7, 4, 4);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(7, 8, 2, 3);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(7, 8, 1, 1);

                // Gilded Waist Cincher & Segmented Tasset Laces
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(0, 17, 16, 2);
                ctx.fillStyle = '#be123c';
                ctx.fillRect(3, 19, 10, 5);
                ctx.fillStyle = '#f472b6';
                ctx.fillRect(7, 18, 2, 6);

                this.addNoise(ctx, 16, 24, 0.04);
                return this.createPixelTexture(cv);
            },
            createArmTexture() {
                const cv = this.createCanvas(8, 24);
                const ctx = cv.getContext('2d');

                // Upper Bare Shoulder & Arm
                ctx.fillStyle = '#fce7f3';
                ctx.fillRect(0, 0, 8, 8);

                // Rose-Gold Armlet & Spiraling Arcane Runic Ribbon
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(0, 4, 8, 1);
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(2, 5, 2, 3);
                ctx.fillRect(4, 7, 2, 2);

                // Sleek Midnight Silk Sleeves & Obsidian Vambraces
                ctx.fillStyle = '#0f051d';
                ctx.fillRect(0, 9, 8, 11);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(1, 11, 6, 2);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(0, 15, 8, 1);

                // Fingerless Dusk Duelist Wraps & Gemmed Knuckles
                ctx.fillStyle = '#1c1917';
                ctx.fillRect(0, 20, 8, 4);
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(2, 21, 4, 1);

                this.addNoise(ctx, 8, 24, 0.04);
                return this.createPixelTexture(cv);
            },
            createPantsTexture() {
                const cv = this.createCanvas(8, 24);
                const ctx = cv.getContext('2d');

                // High-waisted Midnight Velvet Breeches
                ctx.fillStyle = '#0f051d';
                ctx.fillRect(0, 0, 8, 6);
                ctx.fillStyle = '#831843';
                ctx.fillRect(2, 1, 4, 5);

                // Bare Thigh Accent (Thigh-high Stocking Gap)
                ctx.fillStyle = '#fce7f3';
                ctx.fillRect(0, 6, 8, 3);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(0, 8, 8, 1);

                // Armored Knee Guard with Phoenix Talon Trim
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(0, 9, 8, 4);
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(3, 10, 2, 2);

                // High Obsidian & Rose-Gold Sabatons / Greaves
                ctx.fillStyle = '#1e1035';
                ctx.fillRect(0, 13, 8, 11);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(1, 14, 6, 8);
                ctx.fillStyle = '#4c0519';
                ctx.fillRect(2, 15, 4, 6);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(0, 22, 8, 2);

                this.addNoise(ctx, 8, 24, 0.04);
                return this.createPixelTexture(cv);
            },
            createGrassTop() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#4d7c0f';
                ctx.fillRect(0, 0, 16, 16);
                this.addNoise(ctx, 16, 16, 0.12);
                return this.createPixelTexture(cv);
            },
            createGrassSide() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(0, 0, 16, 16);
                ctx.fillStyle = '#4d7c0f';
                ctx.fillRect(0, 0, 16, 5);
                for (let i = 0; i < 16; i += 2) ctx.fillRect(i, 5, 1, 1 + (i % 3));
                this.addNoise(ctx, 16, 16, 0.1);
                return this.createPixelTexture(cv);
            },
            createDirt() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(0, 0, 16, 16);
                this.addNoise(ctx, 16, 16, 0.12);
                return this.createPixelTexture(cv);
            }
        };

        /* -------------------------------------------------------------
           SCENE & LIGHTING
        ------------------------------------------------------------- */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#78a6ff');
        scene.fog = new THREE.FogExp2('#78a6ff', 0.015);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x475569, 0.45);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
        sunLight.position.set(40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // Ground
        const grassMat = [
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassTop(), roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createDirt(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 })
        ];
        const ground = new THREE.Mesh(new THREE.BoxGeometry(80, 2, 80), grassMat);
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        // Water Lake
        const water = new THREE.Mesh(
            new THREE.BoxGeometry(20, 1.8, 20),
            new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.7, roughness: 0.1 })
        );
        water.position.set(0, -0.9, 16);
        scene.add(water);

        /* -------------------------------------------------------------
           3D VOXEL PICKAXE (SOLID VOXEL ARCH)
        ------------------------------------------------------------- */
        function createSolidVoxelPickaxe() {
            const pickaxe = new THREE.Group();

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.9 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.7, roughness: 0.3 });
            const diamondMat = new THREE.MeshStandardMaterial({
                color: 0x00f0ff,
                emissive: 0x0099bb,
                emissiveIntensity: 0.5,
                roughness: 0.2
            });

            // Handle Shaft
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.9, 0.045), woodMat);
            handle.position.y = 0.22;
            handle.castShadow = true;
            pickaxe.add(handle);

            // Grip Collar
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.2, 0.055), goldMat);
            grip.position.y = 0.05;
            pickaxe.add(grip);

            // Top Collar Mount
            const headMount = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.08, 0.065), goldMat);
            headMount.position.y = 0.62;
            pickaxe.add(headMount);

            // Stepped Voxel Pick Head Arch
            const centerHead = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.065, 0.12), diamondMat);
            centerHead.position.set(0, 0.64, 0);
            pickaxe.add(centerHead);

            const frontStep1 = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.1), diamondMat);
            frontStep1.position.set(0, 0.60, 0.1);
            pickaxe.add(frontStep1);

            const frontTip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.055, 0.1), diamondMat);
            frontTip.position.set(0, 0.53, 0.18);
            frontTip.castShadow = true;
            pickaxe.add(frontTip);

            const backStep1 = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.1), diamondMat);
            backStep1.position.set(0, 0.60, -0.1);
            pickaxe.add(backStep1);

            const backTip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.055, 0.1), diamondMat);
            backTip.position.set(0, 0.53, -0.18);
            backTip.castShadow = true;
            pickaxe.add(backTip);

            return pickaxe;
        }

        /* -------------------------------------------------------------
           CHARACTER RIGGING - VESPERA (TWILIGHT PHOENIX VALKYRIE)
        ------------------------------------------------------------- */
        function createCharacterRig() {
            const character = new THREE.Group();

            const hairMat = new THREE.MeshStandardMaterial({ map: TextureGen.createHairTexture(), roughness: 0.6 });
            const faceMat = new THREE.MeshStandardMaterial({ map: TextureGen.createFaceTexture(), roughness: 0.7 });
            const torsoMat = new THREE.MeshStandardMaterial({ map: TextureGen.createTorsoTexture(), roughness: 0.4, metalness: 0.3 });
            const armMat = new THREE.MeshStandardMaterial({ map: TextureGen.createArmTexture(), roughness: 0.4, metalness: 0.3 });
            const pantsMat = new THREE.MeshStandardMaterial({ map: TextureGen.createPantsTexture(), roughness: 0.5, metalness: 0.3 });
            
            // Unique Valkyrie Fantasy Materials
            const roseGoldMat = new THREE.MeshStandardMaterial({ color: 0xfb7185, metalness: 0.85, roughness: 0.25 });
            const darkPlumArmorMat = new THREE.MeshStandardMaterial({ color: 0x2e1065, metalness: 0.7, roughness: 0.3 });
            const phoenixRubyMat = new THREE.MeshStandardMaterial({
                color: 0xf43f5e,
                emissive: 0xbe123c,
                emissiveIntensity: 0.8,
                roughness: 0.1,
                metalness: 0.1
            });
            const twilightGlowMat = new THREE.MeshStandardMaterial({
                color: 0xd946ef,
                emissive: 0xa21caf,
                emissiveIntensity: 0.7,
                roughness: 0.15
            });

            // 1. Head
            const headMaterials = [hairMat, hairMat, hairMat, hairMat, faceMat, hairMat];
            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMaterials);
            headMesh.position.y = 0.25;
            headMesh.castShadow = true;

            // 3D Valkyrie Head Assembly (Tiara, Wing Crests, Elven Fins, Trailing Ponytail)
            const hairBand = new THREE.Group();
            
            // Rose-Gold Diadem Circlet
            const tiara = new THREE.Mesh(new THREE.BoxGeometry(0.53, 0.08, 0.53), roseGoldMat);
            tiara.position.y = 0.38;
            hairBand.add(tiara);

            // Center Phoenix Gem Crest
            const tiaraGem = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.08), phoenixRubyMat);
            tiaraGem.position.set(0, 0.44, 0.26);
            hairBand.add(tiaraGem);

            // Swept-Back Phoenix Wing Crests (Horns)
            const leftHorn = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.18), darkPlumArmorMat);
            leftHorn.position.set(0.24, 0.50, -0.06);
            leftHorn.rotation.set(-0.35, 0, 0.35);
            hairBand.add(leftHorn);

            const leftHornGlow = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.08), twilightGlowMat);
            leftHornGlow.position.set(0.26, 0.56, -0.08);
            leftHornGlow.rotation.set(-0.35, 0, 0.35);
            hairBand.add(leftHornGlow);

            const rightHorn = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.18), darkPlumArmorMat);
            rightHorn.position.set(-0.24, 0.50, -0.06);
            rightHorn.rotation.set(-0.35, 0, -0.35);
            hairBand.add(rightHorn);

            const rightHornGlow = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.08), twilightGlowMat);
            rightHornGlow.position.set(-0.26, 0.56, -0.08);
            rightHornGlow.rotation.set(-0.35, 0, -0.35);
            hairBand.add(rightHornGlow);

            // Delicate Elven Fin / Ear Wings
            const leftEarFin = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.14, 0.16), roseGoldMat);
            leftEarFin.position.set(0.27, 0.26, 0.02);
            leftEarFin.rotation.set(-0.2, 0, 0.4);
            hairBand.add(leftEarFin);

            const rightEarFin = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.14, 0.16), roseGoldMat);
            rightEarFin.position.set(-0.27, 0.26, 0.02);
            rightEarFin.rotation.set(-0.2, 0, -0.4);
            hairBand.add(rightEarFin);

            // Long Trailing Voxel Ponytail (Flows down the back from head)
            const ponytailRoot = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 0.14), roseGoldMat);
            ponytailRoot.position.set(0, 0.38, -0.27);
            hairBand.add(ponytailRoot);

            const ponytailUpper = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.44, 0.14), hairMat);
            ponytailUpper.position.set(0, 0.12, -0.32);
            ponytailUpper.rotation.x = -0.15;
            ponytailUpper.castShadow = true;
            hairBand.add(ponytailUpper);

            const ponytailLower = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.38, 0.10), hairMat);
            ponytailLower.position.set(0, -0.20, -0.36);
            ponytailLower.rotation.x = -0.08;
            ponytailLower.castShadow = true;
            hairBand.add(ponytailLower);

            const ponytailRibbon = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.06, 0.12), twilightGlowMat);
            ponytailRibbon.position.set(0, -0.02, -0.34);
            hairBand.add(ponytailRibbon);

            const headPivot = new THREE.Group();
            headPivot.position.set(0, 1.4, 0);
            headPivot.add(headMesh);
            headPivot.add(hairBand);

            // First-person eye anchor
            const eyeAnchor = new THREE.Object3D();
            eyeAnchor.position.set(0, 0.30, 0.26);
            headPivot.add(eyeAnchor);

            // 2. Torso & Ethereal Valkyrie Wing Glider Core (Back Apparatus)
            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), torsoMat);
            torsoMesh.position.set(0, 1.025, 0);
            torsoMesh.castShadow = true;

            // 3D Back Aethel-Wing Apparatus
            const backpack = new THREE.Group();
            const wingCoreHousing = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.36, 0.12), darkPlumArmorMat);
            wingCoreHousing.position.set(0, 1.05, -0.17);
            wingCoreHousing.castShadow = true;
            backpack.add(wingCoreHousing);

            const wingGildedStruts = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.16, 0.14), roseGoldMat);
            wingGildedStruts.position.set(0, 1.05, -0.17);
            backpack.add(wingGildedStruts);

            const wingHeartGem = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.20, 0.08), phoenixRubyMat);
            wingHeartGem.position.set(0, 1.05, -0.22);
            backpack.add(wingHeartGem);

            // Left Feather Wing Blades
            const leftWingUpper = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.46, 0.08), twilightGlowMat);
            leftWingUpper.position.set(0.22, 1.22, -0.22);
            leftWingUpper.rotation.set(0.2, 0.15, -0.45);
            backpack.add(leftWingUpper);

            const leftWingLower = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.36, 0.06), phoenixRubyMat);
            leftWingLower.position.set(0.32, 1.05, -0.25);
            leftWingLower.rotation.set(0.1, 0.1, -0.65);
            backpack.add(leftWingLower);

            // Right Feather Wing Blades
            const rightWingUpper = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.46, 0.08), twilightGlowMat);
            rightWingUpper.position.set(-0.22, 1.22, -0.22);
            rightWingUpper.rotation.set(0.2, -0.15, 0.45);
            backpack.add(rightWingUpper);

            const rightWingLower = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.36, 0.06), phoenixRubyMat);
            rightWingLower.position.set(-0.32, 1.05, -0.25);
            rightWingLower.rotation.set(0.1, -0.1, 0.65);
            backpack.add(rightWingLower);

            // 3. Left Arm (Valkyrie Feather Pauldron)
            const leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), armMat);
            leftArmMesh.position.y = -0.275;
            leftArmMesh.castShadow = true;

            // Tiered Rose-Gold & Plum Pauldron
            const pauldron = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.20, 0.32), darkPlumArmorMat);
            pauldron.position.set(0.03, 0.05, 0);
            leftArmMesh.add(pauldron);

            const pauldronTrim = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.35), roseGoldMat);
            pauldronTrim.position.set(0.03, 0.08, 0);
            leftArmMesh.add(pauldronTrim);

            const pauldronGem = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.16, 0.10), phoenixRubyMat);
            pauldronGem.position.set(0.08, 0.18, 0);
            leftArmMesh.add(pauldronGem);

            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(0.375, 1.35, 0);
            leftArmPivot.add(leftArmMesh);

            // 4. Right Arm + Pickaxe (Duelist Armlet & Bracer Guard)
            const rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), armMat);
            rightArmMesh.position.y = -0.275;
            rightArmMesh.castShadow = true;

            const duelistPauldron = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.12, 0.28), roseGoldMat);
            duelistPauldron.position.set(-0.01, 0.04, 0);
            rightArmMesh.add(duelistPauldron);

            const pickaxe = createSolidVoxelPickaxe();
            pickaxe.position.set(0, -0.28, 0.1);
            pickaxe.rotation.x = THREE.MathUtils.degToRad(30);
            rightArmMesh.add(pickaxe);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(-0.375, 1.35, 0);
            rightArmPivot.add(rightArmMesh);

            // 5. Legs with Flared Sabatons & Talon Knee Guards
            const leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), pantsMat);
            leftLegMesh.position.y = -0.375;
            leftLegMesh.castShadow = true;

            const leftKneePlate = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.14, 0.08), roseGoldMat);
            leftKneePlate.position.set(0, -0.25, 0.11);
            leftLegMesh.add(leftKneePlate);

            const leftKneeGem = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.04), phoenixRubyMat);
            leftKneeGem.position.set(0, -0.25, 0.14);
            leftLegMesh.add(leftKneeGem);

            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(0.13, 0.65, 0);
            leftLegPivot.add(leftLegMesh);

            const rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), pantsMat);
            rightLegMesh.position.y = -0.375;
            rightLegMesh.castShadow = true;

            const rightKneePlate = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.14, 0.08), roseGoldMat);
            rightKneePlate.position.set(0, -0.25, 0.11);
            rightLegMesh.add(rightKneePlate);

            const rightKneeGem = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.04), phoenixRubyMat);
            rightKneeGem.position.set(0, -0.25, 0.14);
            rightLegMesh.add(rightKneeGem);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(-0.13, 0.65, 0);
            rightLegPivot.add(rightLegMesh);

            // Hierarchy Assembly
            const bodyGroup = new THREE.Group();
            bodyGroup.add(headPivot);
            bodyGroup.add(torsoMesh);
            bodyGroup.add(backpack);
            bodyGroup.add(leftArmPivot);
            bodyGroup.add(rightArmPivot);
            bodyGroup.add(leftLegPivot);
            bodyGroup.add(rightLegPivot);

            bodyGroup.rotation.y = Math.PI;
            character.add(bodyGroup);

            return {
                root: character,
                body: bodyGroup,
                headPivot: headPivot,
                eyeAnchor: eyeAnchor,
                headMesh: headMesh,
                hairBand: hairBand,
                torsoMesh: torsoMesh,
                backpack: backpack,
                leftArm: leftArmPivot,
                leftArmMesh: leftArmMesh,
                rightArm: rightArmPivot,
                rightArmMesh: rightArmMesh,
                leftLeg: leftLegPivot,
                rightLeg: rightLegPivot,
                pickaxe: pickaxe
            };
        }

        const player = createCharacterRig();
        scene.add(player.root);

        /* -------------------------------------------------------------
           CONTROLS & INPUT
        ------------------------------------------------------------- */
        const keys = {};
        let isFirstPerson = false;
        let isPointerLocked = false;
        let isSwinging = false;
        let swingTimer = 0;
        const SWING_DURATION = 0.22;

        let cameraPitch = 0;
        let cameraYaw = 0;
        let bodyYaw = 0;
        const MAX_HEAD_TURN = THREE.MathUtils.degToRad(65);

        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', () => document.body.requestPointerLock());

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = (document.pointerLockElement === document.body);
            blocker.style.display = isPointerLocked ? 'none' : 'flex';
        });

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyV') {
                isFirstPerson = !isFirstPerson;
                document.getElementById('cam-mode').innerText = isFirstPerson ? "1st Person [V]" : "3rd Person [V]";
                setFirstPersonMeshVisibility(isFirstPerson);
            }
        });

        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isPointerLocked && !isSwinging) {
                isSwinging = true;
                swingTimer = 0;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            const sens = 0.0022;
            cameraYaw -= e.movementX * sens;
            cameraPitch -= e.movementY * sens;
            cameraPitch = Math.max(-Math.PI / 2.05, Math.min(Math.PI / 2.05, cameraPitch));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function setFirstPersonMeshVisibility(fp) {
            player.headMesh.visible = !fp;
            player.hairBand.visible = !fp;

            player.torsoMesh.visible = true;
            player.backpack.visible = true;
            player.leftArmMesh.visible = true;
            player.rightArmMesh.visible = true;
            player.leftLeg.visible = true;
            player.rightLeg.visible = true;
        }

        /* -------------------------------------------------------------
           ANIMATION & KINEMATICS
        ------------------------------------------------------------- */
        const clock = new THREE.Clock();
        let walkTimer = 0;
        let swimTimer = 0;
        let verticalVelocity = 0;
        let isGrounded = true;

        function updateGame(delta) {
            const pos = player.root.position;
            const inWater = (pos.x > -10 && pos.x < 10 && pos.z > 6 && pos.z < 26);
            document.getElementById('water-state').innerText = inWater ? "Swimming Pool" : "Lush Land";
            document.getElementById('water-state').style.color = inWater ? "#38bdf8" : "#86efac";

            /* --- WASD VECTOR CALCULATION --- */
            const camForwardX = -Math.sin(cameraYaw);
            const camForwardZ = -Math.cos(cameraYaw);
            const camRightX = Math.cos(cameraYaw);
            const camRightZ = -Math.sin(cameraYaw);

            let moveX = 0;
            let moveZ = 0;

            if (keys['KeyW'] || keys['ArrowUp']) {
                moveX += camForwardX;
                moveZ += camForwardZ;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                moveX -= camForwardX;
                moveZ -= camForwardZ;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                moveX += camRightX;
                moveZ += camRightZ;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) {
                moveX -= camRightX;
                moveZ -= camRightZ;
            }

            const inputLengthSq = moveX * moveX + moveZ * moveZ;
            const isMoving = inputLengthSq > 0.0001;

            if (isMoving) {
                const len = Math.sqrt(inputLengthSq);
                moveX /= len;
                moveZ /= len;
            }

            const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
            const speed = inWater ? 3.2 : (isSprinting ? 6.8 : 4.0);

            if (isMoving) {
                pos.x += moveX * speed * delta;
                pos.z += moveZ * speed * delta;
            }

            /* --- HEAD DECOUPLING & BODY ORIENTATION --- */
            if (isFirstPerson) {
                let lookDiff = cameraYaw - bodyYaw;
                lookDiff = Math.atan2(Math.sin(lookDiff), Math.cos(lookDiff));

                if (Math.abs(lookDiff) > MAX_HEAD_TURN) {
                    const excess = lookDiff > 0
                        ? lookDiff - MAX_HEAD_TURN
                        : lookDiff + MAX_HEAD_TURN;
                    bodyYaw += excess * Math.min(1.0, delta * 10.0);

                    lookDiff = cameraYaw - bodyYaw;
                    lookDiff = Math.atan2(Math.sin(lookDiff), Math.cos(lookDiff));
                }

                player.headPivot.rotation.y = THREE.MathUtils.clamp(
                    lookDiff,
                    -MAX_HEAD_TURN,
                    MAX_HEAD_TURN
                );
                player.headPivot.rotation.x = -cameraPitch;
            } else {
                if (isMoving) {
                    const targetMoveAngle = Math.atan2(-moveX, -moveZ);
                    let angleDiff = targetMoveAngle - bodyYaw;
                    angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                    bodyYaw += angleDiff * Math.min(1.0, delta * 12.0);
                }

                player.headPivot.rotation.y = THREE.MathUtils.lerp(
                    player.headPivot.rotation.y,
                    0,
                    Math.min(1.0, delta * 12.0)
                );
                player.headPivot.rotation.x = THREE.MathUtils.lerp(
                    player.headPivot.rotation.x,
                    0,
                    Math.min(1.0, delta * 12.0)
                );
            }

            player.root.rotation.y = bodyYaw;

            /* --- VERTICAL PHYSICS / SWIMMING --- */
            if (inWater) {
                isGrounded = false;
                if (keys['Space']) {
                    pos.y += 2.8 * delta;
                    if (pos.y > -0.2) pos.y = -0.2;
                } else if (keys['ShiftLeft']) {
                    pos.y -= 2.8 * delta;
                    if (pos.y < -1.4) pos.y = -1.4;
                } else {
                    pos.y = THREE.MathUtils.lerp(pos.y, -0.45 + Math.sin(clock.getElapsedTime() * 2.5) * 0.04, delta * 3);
                }
            } else {
                if (keys['Space'] && isGrounded) {
                    verticalVelocity = 8.5;
                    isGrounded = false;
                }
                verticalVelocity += -24 * delta;
                pos.y += verticalVelocity * delta;
                if (pos.y <= 0) {
                    pos.y = 0;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }

            pos.x = Math.max(-36, Math.min(36, pos.x));
            pos.z = Math.max(-36, Math.min(36, pos.z));

            /* --- ANIMATION CONTROLLER --- */
            let stateLabel = "IDLE";
            if (inWater) {
                stateLabel = isMoving ? "SWIMMING" : "TREADING WATER";
                swimTimer += delta * (isMoving ? 8.0 : 3.0);

                const swimPitch = isMoving ? -Math.PI / 2.05 : 0.2;
                player.body.rotation.x = THREE.MathUtils.lerp(
                    player.body.rotation.x,
                    swimPitch,
                    Math.min(1.0, delta * 8)
                );

                player.leftArm.rotation.x = -Math.PI / 3 + Math.sin(swimTimer) * 0.9;
                player.leftArm.rotation.z = -0.3;
                if (!isSwinging) {
                    player.rightArm.rotation.x = -Math.PI / 3 + Math.sin(swimTimer + Math.PI) * 0.9;
                    player.rightArm.rotation.z = 0.3;
                }
                player.leftLeg.rotation.x = Math.sin(swimTimer * 1.6) * 0.4;
                player.rightLeg.rotation.x = -Math.sin(swimTimer * 1.6) * 0.4;

            } else {
                player.body.rotation.x = THREE.MathUtils.lerp(player.body.rotation.x, 0, delta * 10);

                if (isMoving && isGrounded) {
                    stateLabel = isSprinting ? "SPRINTING" : "WALKING";
                    const freq = isSprinting ? 14 : 9;
                    walkTimer += delta * freq;

                    const legAngle = Math.sin(walkTimer) * (isSprinting ? 0.9 : 0.65);
                    player.leftLeg.rotation.x = legAngle;
                    player.rightLeg.rotation.x = -legAngle;

                    player.leftArm.rotation.x = -legAngle * 0.8;
                    player.leftArm.rotation.z = 0.05;
                    if (!isSwinging) {
                        player.rightArm.rotation.x = legAngle * 0.8;
                        player.rightArm.rotation.z = -0.05;
                    }
                    player.body.position.y = Math.abs(Math.sin(walkTimer)) * 0.08;

                } else if (!isGrounded) {
                    stateLabel = "AIRBORNE";
                    player.leftLeg.rotation.x = -0.4;
                    player.rightLeg.rotation.x = 0.2;
                    player.leftArm.rotation.x = -0.5;
                    if (!isSwinging) player.rightArm.rotation.x = -0.5;
                } else {
                    stateLabel = "IDLE";
                    const idleTime = clock.getElapsedTime() * 2.2;
                    player.leftLeg.rotation.x = THREE.MathUtils.lerp(player.leftLeg.rotation.x, 0, delta * 8);
                    player.rightLeg.rotation.x = THREE.MathUtils.lerp(player.rightLeg.rotation.x, 0, delta * 8);
                    player.leftArm.rotation.x = THREE.MathUtils.lerp(player.leftArm.rotation.x, 0, delta * 8);
                    player.leftArm.rotation.z = 0.08 + Math.sin(idleTime) * 0.03;

                    if (!isSwinging) {
                        player.rightArm.rotation.x = THREE.MathUtils.lerp(player.rightArm.rotation.x, 0, delta * 8);
                        player.rightArm.rotation.z = -0.08 - Math.sin(idleTime) * 0.03;
                    }
                    player.body.position.y = Math.sin(idleTime) * 0.015;
                }
            }

            /* --- STRIKE / SWING ANIMATION --- */
            if (isSwinging) {
                swingTimer += delta;
                const progress = swingTimer / SWING_DURATION;
                if (progress <= 1.0) {
                    stateLabel += " + MINING";
                    const strike = Math.sin(progress * Math.PI);
                    player.rightArm.rotation.x = -Math.PI / 2.8 - strike * 1.5;
                    player.rightArm.rotation.y = -strike * 0.35;
                    player.rightArm.rotation.z = -strike * 0.2;
                } else {
                    isSwinging = false;
                    swingTimer = 0;
                    player.rightArm.rotation.y = 0;
                }
            }

            document.getElementById('anim-state').innerText = stateLabel;
        }

        /* -------------------------------------------------------------
           CAMERA SYSTEM
        ------------------------------------------------------------- */
        function updateCamera() {
            const headWorldPos = new THREE.Vector3();
            const eyeWorldPos = new THREE.Vector3();
            player.headPivot.getWorldPosition(headWorldPos);
            player.eyeAnchor.getWorldPosition(eyeWorldPos);

            if (isFirstPerson) {
                camera.position.copy(eyeWorldPos);

                const lookDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                ).normalize();

                camera.lookAt(camera.position.clone().add(lookDir));

            } else {
                const camDistance = 3.8;
                const targetPoint = headWorldPos.clone().add(new THREE.Vector3(0, 0.30, 0));

                const cx = Math.sin(cameraYaw) * Math.cos(cameraPitch) * camDistance;
                const cy = -Math.sin(cameraPitch) * camDistance;
                const cz = Math.cos(cameraYaw) * Math.cos(cameraPitch) * camDistance;

                const desiredCamPos = new THREE.Vector3(
                    targetPoint.x + cx,
                    Math.max(0.1, targetPoint.y + cy),
                    targetPoint.z + cz
                );

                camera.position.lerp(desiredCamPos, 0.4);
                camera.lookAt(targetPoint);
            }
        }

        /* -------------------------------------------------------------
           RENDER LOOP
        ------------------------------------------------------------- */
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            updateGame(delta);
            updateCamera();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
