<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Minecraft Character - Fixed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #050811;
            font-family: 'Consolas', monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px #000;
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            font-size: 13px;
            line-height: 1.7;
            pointer-events: none;
            background: rgba(10, 16, 26, 0.8);
            padding: 14px 18px;
            border-radius: 6px;
            border: 2px solid #29394f;
        }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            text-shadow: 1px 1px 2px #000;
            font-size: 13px;
            background: rgba(10, 16, 26, 0.85);
            padding: 10px 22px;
            border-radius: 6px;
            border: 1px solid #334155;
            pointer-events: none;
            text-align: center;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 17, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 10;
        }
        #blocker h1 {
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #00e5ff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="blocker">
        <h1>CLICK TO START</h1>
        <p style="color: #94a3b8;">Controls: WASD | Shift to Sprint | Left Click to Strike | V for View</p>
    </div>
    <div id="crosshair"></div>
    <div id="ui">
        <div><b>CAMERA:</b> <span id="cam-mode" style="color:#fcd34d;">3rd Person [V]</span></div>
        <div><b>ACTION:</b> <span id="anim-state">IDLE</span></div>
        <div><b>TERRAIN:</b> <span id="water-state">Dry Land</span></div>
    </div>
    <div id="instructions">
        [W,A,S,D] Move | [SPACE] Jump/Float | [SHIFT] Sprint | [L-CLICK] Swing Pickaxe | [V] Camera View
    </div>
    <div id="canvas-container"></div>

    <script>
        /* -------------------------------------------------------------
           PROCEDURAL TEXTURES
        ------------------------------------------------------------- */
        const TextureGen = {
            createCanvas(w, h) {
                const cv = document.createElement('canvas');
                cv.width = w; cv.height = h;
                return cv;
            },
            createPixelTexture(cv) {
                const tex = new THREE.CanvasTexture(cv);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                return tex;
            },
            addNoise(ctx, w, h, factor = 0.08) {
                const img = ctx.getImageData(0, 0, w, h);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const n = (Math.random() - 0.5) * factor * 255;
                    d[i] = Math.min(255, Math.max(0, d[i] + n));
                    d[i+1] = Math.min(255, Math.max(0, d[i+1] + n));
                    d[i+2] = Math.min(255, Math.max(0, d[i+2] + n));
                }
                ctx.putImageData(img, 0, 0);
            },
            createFaceTexture() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');

                // Weathered warm skin
                ctx.fillStyle = '#b9785f';
                ctx.fillRect(0, 0, 16, 16);
                ctx.fillStyle = '#c98d70';
                ctx.fillRect(2, 4, 12, 7);

                // Silver temple hair framing the face
                ctx.fillStyle = '#c8d3df';
                ctx.fillRect(0, 0, 16, 3);
                ctx.fillRect(0, 3, 2, 8);
                ctx.fillRect(14, 3, 2, 8);
                ctx.fillStyle = '#8d9bac';
                ctx.fillRect(2, 1, 4, 2);
                ctx.fillRect(10, 0, 4, 2);

                // Left eye: old gold
                ctx.fillStyle = '#f5e6c8';
                ctx.fillRect(3, 6, 3, 2);
                ctx.fillStyle = '#d6a52e';
                ctx.fillRect(4, 6, 1, 2);

                // Right eye: rift-touched violet glow
                ctx.fillStyle = '#2b123e';
                ctx.fillRect(10, 5, 4, 4);
                ctx.fillStyle = '#b86cff';
                ctx.fillRect(11, 6, 2, 2);
                ctx.fillStyle = '#f5e8ff';
                ctx.fillRect(12, 6, 1, 1);

                // Angular arcane scar/rune under the rift eye
                ctx.fillStyle = '#7d3bb5';
                ctx.fillRect(12, 9, 1, 3);
                ctx.fillRect(11, 11, 2, 1);

                // Nose
                ctx.fillStyle = '#9f604f';
                ctx.fillRect(7, 8, 2, 2);

                // Heavy silver moustache + beard edge
                ctx.fillStyle = '#dbe4eb';
                ctx.fillRect(4, 10, 8, 2);
                ctx.fillRect(3, 12, 10, 2);
                ctx.fillRect(5, 14, 6, 2);
                ctx.fillStyle = '#9eacba';
                ctx.fillRect(4, 12, 2, 1);
                ctx.fillRect(10, 13, 2, 1);

                this.addNoise(ctx, 16, 16, 0.035);
                return this.createPixelTexture(cv);
            },
            createHairTexture() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#b9c6d3';
                ctx.fillRect(0, 0, 16, 16);
                ctx.fillStyle = '#e5edf3';
                ctx.fillRect(1, 1, 5, 5);
                ctx.fillRect(9, 3, 6, 4);
                ctx.fillRect(3, 10, 4, 5);
                ctx.fillStyle = '#7d8b9b';
                ctx.fillRect(0, 7, 5, 3);
                ctx.fillRect(11, 10, 5, 4);
                this.addNoise(ctx, 16, 16, 0.045);
                return this.createPixelTexture(cv);
            },
            createTorsoTexture() {
                const cv = this.createCanvas(16, 24);
                const ctx = cv.getContext('2d');

                // Deep astral robe
                ctx.fillStyle = '#17112c';
                ctx.fillRect(0, 0, 16, 24);
                ctx.fillStyle = '#241746';
                ctx.fillRect(2, 0, 12, 24);

                // High collar / mantle
                ctx.fillStyle = '#0e2638';
                ctx.fillRect(0, 0, 16, 4);
                ctx.fillStyle = '#2c6b78';
                ctx.fillRect(0, 3, 16, 1);

                // Asymmetric gold sash
                ctx.fillStyle = '#a97825';
                ctx.fillRect(2, 4, 3, 3);
                ctx.fillRect(4, 7, 3, 4);
                ctx.fillRect(6, 11, 3, 4);
                ctx.fillRect(8, 15, 3, 5);
                ctx.fillStyle = '#e3bd54';
                ctx.fillRect(3, 4, 1, 3);
                ctx.fillRect(7, 12, 1, 3);

                // Belt
                ctx.fillStyle = '#24150f';
                ctx.fillRect(0, 18, 16, 3);
                ctx.fillStyle = '#77531e';
                ctx.fillRect(6, 18, 4, 3);

                // Central astral sigil
                ctx.fillStyle = '#62e6dc';
                ctx.fillRect(10, 7, 2, 2);
                ctx.fillRect(9, 9, 4, 1);
                ctx.fillRect(10, 10, 2, 3);
                ctx.fillStyle = '#d7fffb';
                ctx.fillRect(10, 9, 1, 1);

                // Tiny star-runes
                ctx.fillStyle = '#8063bf';
                ctx.fillRect(3, 13, 1, 1);
                ctx.fillRect(13, 5, 1, 1);
                ctx.fillRect(12, 15, 1, 1);
                ctx.fillRect(4, 22, 1, 1);

                this.addNoise(ctx, 16, 24, 0.035);
                return this.createPixelTexture(cv);
            },
            createArmTexture() {
                const cv = this.createCanvas(8, 24);
                const ctx = cv.getContext('2d');

                // Robe sleeve
                ctx.fillStyle = '#21163f';
                ctx.fillRect(0, 0, 8, 14);
                ctx.fillStyle = '#30205a';
                ctx.fillRect(1, 2, 6, 8);

                // Rune-thread cuff
                ctx.fillStyle = '#2d7e83';
                ctx.fillRect(0, 12, 8, 3);
                ctx.fillStyle = '#73e4da';
                ctx.fillRect(1, 13, 2, 1);
                ctx.fillRect(5, 13, 2, 1);

                // Leather spellcasting glove
                ctx.fillStyle = '#2a201f';
                ctx.fillRect(0, 15, 8, 9);
                ctx.fillStyle = '#6f4b38';
                ctx.fillRect(1, 16, 6, 5);
                ctx.fillStyle = '#b78a3e';
                ctx.fillRect(0, 20, 8, 2);

                this.addNoise(ctx, 8, 24, 0.04);
                return this.createPixelTexture(cv);
            },
            createPantsTexture() {
                const cv = this.createCanvas(8, 24);
                const ctx = cv.getContext('2d');

                // Lower robe/trousers
                ctx.fillStyle = '#161129';
                ctx.fillRect(0, 0, 8, 15);
                ctx.fillStyle = '#2b1d4a';
                ctx.fillRect(1, 2, 6, 10);
                ctx.fillStyle = '#876329';
                ctx.fillRect(0, 12, 8, 2);

                // Dark enchanted boots
                ctx.fillStyle = '#16151b';
                ctx.fillRect(0, 15, 8, 9);
                ctx.fillStyle = '#3b3349';
                ctx.fillRect(1, 16, 6, 3);
                ctx.fillStyle = '#4c8f91';
                ctx.fillRect(0, 20, 8, 1);

                this.addNoise(ctx, 8, 24, 0.045);
                return this.createPixelTexture(cv);
            },
            createGrassTop() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#4d7c0f';
                ctx.fillRect(0, 0, 16, 16);
                this.addNoise(ctx, 16, 16, 0.12);
                return this.createPixelTexture(cv);
            },
            createGrassSide() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(0, 0, 16, 16);
                ctx.fillStyle = '#4d7c0f';
                ctx.fillRect(0, 0, 16, 5);
                for (let i = 0; i < 16; i += 2) ctx.fillRect(i, 5, 1, 1 + (i % 3));
                this.addNoise(ctx, 16, 16, 0.1);
                return this.createPixelTexture(cv);
            },
            createDirt() {
                const cv = this.createCanvas(16, 16);
                const ctx = cv.getContext('2d');
                ctx.fillStyle = '#5c4033';
                ctx.fillRect(0, 0, 16, 16);
                this.addNoise(ctx, 16, 16, 0.12);
                return this.createPixelTexture(cv);
            }
        };

        /* -------------------------------------------------------------
           SCENE & LIGHTING
        ------------------------------------------------------------- */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#78a6ff');
        scene.fog = new THREE.FogExp2('#78a6ff', 0.015);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x475569, 0.45);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
        sunLight.position.set(40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // Ground
        const grassMat = [
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassTop(), roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createDirt(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ map: TextureGen.createGrassSide(), roughness: 0.9 })
        ];
        const ground = new THREE.Mesh(new THREE.BoxGeometry(80, 2, 80), grassMat);
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        // Water Lake
        const water = new THREE.Mesh(
            new THREE.BoxGeometry(20, 1.8, 20),
            new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.7, roughness: 0.1 })
        );
        water.position.set(0, -0.9, 16);
        scene.add(water);

        /* -------------------------------------------------------------
           3D VOXEL PICKAXE (CLEAN SOLID VOXEL ARCH)
        ------------------------------------------------------------- */
        function createSolidVoxelPickaxe() {
            const pickaxe = new THREE.Group();

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.9 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.7, roughness: 0.3 });
            const diamondMat = new THREE.MeshStandardMaterial({
                color: 0x00f0ff,
                emissive: 0x0099bb,
                emissiveIntensity: 0.5,
                roughness: 0.2
            });

            // 1. Long Handle Shaft (along Y)
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.9, 0.045), woodMat);
            handle.position.y = 0.22;
            handle.castShadow = true;
            pickaxe.add(handle);

            // Grip Collar
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.2, 0.055), goldMat);
            grip.position.y = 0.05;
            pickaxe.add(grip);

            // Top Collar Mount
            const headMount = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.08, 0.065), goldMat);
            headMount.position.y = 0.62;
            pickaxe.add(headMount);

            // 2. Stepped Voxel Pick Head Arch (Aligned on Z-axis for forward strike)
            // Center top piece
            const centerHead = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.065, 0.12), diamondMat);
            centerHead.position.set(0, 0.64, 0);
            pickaxe.add(centerHead);

            // Front Blade (Stepped Down towards +Z)
            const frontStep1 = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.1), diamondMat);
            frontStep1.position.set(0, 0.60, 0.1);
            pickaxe.add(frontStep1);

            const frontTip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.055, 0.1), diamondMat);
            frontTip.position.set(0, 0.53, 0.18);
            frontTip.castShadow = true;
            pickaxe.add(frontTip);

            // Back Blade (Stepped Down towards -Z)
            const backStep1 = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.06, 0.1), diamondMat);
            backStep1.position.set(0, 0.60, -0.1);
            pickaxe.add(backStep1);

            const backTip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.055, 0.1), diamondMat);
            backTip.position.set(0, 0.53, -0.18);
            backTip.castShadow = true;
            pickaxe.add(backTip);

            return pickaxe;
        }

        /* -------------------------------------------------------------
           CHARACTER RIGGING
        ------------------------------------------------------------- */
        function createCharacterRig() {
            const character = new THREE.Group();

            const hairMat = new THREE.MeshStandardMaterial({ map: TextureGen.createHairTexture(), roughness: 0.8 });
            const faceMat = new THREE.MeshStandardMaterial({ map: TextureGen.createFaceTexture(), roughness: 0.82 });
            const torsoMat = new THREE.MeshStandardMaterial({ map: TextureGen.createTorsoTexture(), roughness: 0.78 });
            const armMat = new THREE.MeshStandardMaterial({ map: TextureGen.createArmTexture(), roughness: 0.8 });
            const pantsMat = new THREE.MeshStandardMaterial({ map: TextureGen.createPantsTexture(), roughness: 0.85 });

            // Wizard-only visual materials. These do not alter the rig or gameplay.
            const hatMat = new THREE.MeshStandardMaterial({ color: 0x21133f, roughness: 0.9 });
            const hatShadowMat = new THREE.MeshStandardMaterial({ color: 0x100a20, roughness: 0.95 });
            const runeMat = new THREE.MeshStandardMaterial({
                color: 0x70f0e6,
                emissive: 0x1b8b88,
                emissiveIntensity: 0.85,
                roughness: 0.35
            });
            const riftMat = new THREE.MeshStandardMaterial({
                color: 0xb365ff,
                emissive: 0x6b23a8,
                emissiveIntensity: 1.0,
                roughness: 0.28
            });
            const goldMatWizard = new THREE.MeshStandardMaterial({ color: 0xb88932, metalness: 0.65, roughness: 0.32 });
            const silverMat = new THREE.MeshStandardMaterial({ color: 0xb7c4d0, metalness: 0.25, roughness: 0.58 });
            const leatherMat = new THREE.MeshStandardMaterial({ color: 0x291b18, roughness: 0.88 });
            const bookMat = new THREE.MeshStandardMaterial({ color: 0x30184c, roughness: 0.78 });
            const pageMat = new THREE.MeshStandardMaterial({ color: 0xcbbf9c, roughness: 0.95 });
            const robeMat = new THREE.MeshStandardMaterial({ color: 0x1a1232, roughness: 0.9 });

            function makeBox(w, h, d, mat, x, y, z, parent, castShadow = true) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = castShadow;
                parent.add(mesh);
                return mesh;
            }

            // 1. Head -- unchanged dimensions and pivot placement.
            const headMaterials = [hairMat, hairMat, hairMat, hairMat, faceMat, hairMat];
            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMaterials);
            headMesh.position.y = 0.25;
            headMesh.castShadow = true;

            // Sculpted block-beard, parented to the head so first-person hiding stays clean.
            const beardRoot = new THREE.Group();
            beardRoot.position.set(0, -0.12, 0.276);
            headMesh.add(beardRoot);
            // Stagger the visible beard faces by >1 cm in depth.  The original
            // stepped blocks were only ~0.5-4.5 mm apart on overlapping regions,
            // which is unnecessarily close for a 0.05..500 camera depth range.
            makeBox(0.34, 0.13, 0.070, silverMat, 0, 0, 0, beardRoot);
            makeBox(0.26, 0.11, 0.090, silverMat, 0, -0.105, 0.003, beardRoot);
            makeBox(0.16, 0.10, 0.110, silverMat, 0, -0.195, 0.006, beardRoot);
            makeBox(0.08, 0.07, 0.130, silverMat, 0, -0.265, 0.009, beardRoot);

            // "hairBand" remains the single head-accessory visibility handle used by
            // the existing first-person code, but now contains a crooked voxel wizard hat.
            const hairBand = new THREE.Group();
            hairBand.position.set(0, 0.48, 0);

            const brim = makeBox(0.74, 0.075, 0.70, hatShadowMat, 0, 0, 0, hairBand);
            brim.rotation.y = THREE.MathUtils.degToRad(4);
            makeBox(0.54, 0.16, 0.52, hatMat, -0.015, 0.105, 0.0, hairBand);
            makeBox(0.43, 0.17, 0.43, hatMat, 0.025, 0.255, -0.01, hairBand);
            makeBox(0.34, 0.16, 0.34, hatMat, -0.005, 0.405, -0.015, hairBand);
            makeBox(0.26, 0.15, 0.27, hatMat, 0.045, 0.535, -0.015, hairBand);
            const bentTip = makeBox(0.19, 0.14, 0.22, hatMat, 0.105, 0.645, 0.005, hairBand);
            bentTip.rotation.z = THREE.MathUtils.degToRad(-17);
            const tip = makeBox(0.12, 0.12, 0.18, hatMat, 0.165, 0.74, 0.02, hairBand);
            tip.rotation.z = THREE.MathUtils.degToRad(-27);

            // Hat band and a little rift crystal mounted asymmetrically.
            // Keep the band visibly proud of the cone in X/Z, but sink its top
            // below the cone's top plane. Previously both top faces were y=0.185,
            // producing the striped z-fighting visible from above.
            makeBox(0.57, 0.058, 0.55, goldMatWizard, -0.01, 0.137, 0, hairBand);
            makeBox(0.09, 0.09, 0.08, runeMat, -0.01, 0.15, 0.294, hairBand, false);
            const hatCrystal = makeBox(0.09, 0.18, 0.09, riftMat, -0.30, 0.18, 0.02, hairBand);
            hatCrystal.rotation.z = THREE.MathUtils.degToRad(18);
            makeBox(0.05, 0.10, 0.05, runeMat, -0.355, 0.25, 0.02, hairBand, false);

            const headPivot = new THREE.Group();
            headPivot.position.set(0, 1.4, 0);
            headPivot.add(headMesh);
            headPivot.add(hairBand);

            // First-person camera anchor: EXACTLY the original placement.
            const eyeAnchor = new THREE.Object3D();
            eyeAnchor.position.set(0, 0.30, 0.26);
            headPivot.add(eyeAnchor);

            // 2. Torso -- original dimensions/position preserved.
            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), torsoMat);
            torsoMesh.position.set(0, 1.025, 0);
            torsoMesh.castShadow = true;

            // Layered front robe tabard and glowing clasp; decorative children only.
            const tabard = makeBox(0.34, 0.48, 0.035, robeMat, 0, -0.36, 0.145, torsoMesh);
            tabard.rotation.z = THREE.MathUtils.degToRad(2);
            makeBox(0.06, 0.26, 0.042, goldMatWizard, -0.11, -0.34, 0.166, torsoMesh);
            makeBox(0.06, 0.16, 0.042, runeMat, 0.105, -0.35, 0.166, torsoMesh, false);
            // Small forward overlap instead of an exactly tangent back face.
            makeBox(0.12, 0.10, 0.05, goldMatWizard, 0, 0.03, 0.16, torsoMesh);
            makeBox(0.06, 0.06, 0.06, runeMat, 0, 0.03, 0.185, torsoMesh, false);

            // High asymmetric mantle pieces.
            // Give both mantle faces a real depth step from the torso instead of
            // leaving the gold side only 5 mm in front of the torso face.
            makeBox(0.22, 0.10, 0.32, hatShadowMat, 0.20, 0.28, 0.00, torsoMesh);
            makeBox(0.18, 0.07, 0.30, goldMatWizard, -0.20, 0.25, 0.00, torsoMesh);

            // Original backpack slot becomes a chained spellbook pack, still at the same anchor.
            const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.45, 0.15), bookMat);
            backpack.position.set(0, 1.05, -0.19);
            backpack.castShadow = true;
            makeBox(0.32, 0.37, 0.035, pageMat, 0, 0, -0.09, backpack);
            // Move the rails 1 cm outward. At +/-0.13 their outer side planes
            // were exactly x=+/-0.16, identical to the page block's side planes.
            // The rails now overlap the page volume without sharing a surface.
            makeBox(0.06, 0.40, 0.04, goldMatWizard, -0.14, 0, -0.115, backpack);
            makeBox(0.06, 0.40, 0.04, goldMatWizard, 0.14, 0, -0.115, backpack);
            makeBox(0.13, 0.13, 0.04, runeMat, 0, 0, -0.12, backpack, false);

            // 3. Left Arm -- identical rig dimensions and pivot.
            const leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), armMat);
            leftArmMesh.position.y = -0.275;
            leftArmMesh.castShadow = true;

            // Crystal pauldron replaces the old metal adventurer pauldron.
            const pauldron = new THREE.Mesh(new THREE.BoxGeometry(0.31, 0.16, 0.31), hatShadowMat);
            pauldron.position.set(0.01, 0.02, 0);
            pauldron.castShadow = true;
            leftArmMesh.add(pauldron);
            const leftCrystalA = makeBox(0.09, 0.22, 0.09, riftMat, 0.075, 0.11, -0.02, leftArmMesh);
            leftCrystalA.rotation.z = THREE.MathUtils.degToRad(-12);
            const leftCrystalB = makeBox(0.07, 0.15, 0.07, runeMat, -0.065, 0.08, 0.04, leftArmMesh, false);
            leftCrystalB.rotation.z = THREE.MathUtils.degToRad(14);

            const leftArmPivot = new THREE.Group();
            // Original anatomical side convention retained verbatim.
            leftArmPivot.position.set(0.375, 1.35, 0);
            leftArmPivot.add(leftArmMesh);

            // 4. Right Arm + Pickaxe -- pickaxe creation/anchor/angle are EXACTLY preserved.
            const rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), armMat);
            rightArmMesh.position.y = -0.275;
            rightArmMesh.castShadow = true;

            // Smaller rune guard so the mining silhouette remains unobstructed.
            makeBox(0.28, 0.11, 0.28, goldMatWizard, 0, 0.015, 0, rightArmMesh);
            // Slightly embed the gem into the guard; its rear face previously
            // touched the guard front plane exactly at z=0.14.
            makeBox(0.07, 0.07, 0.05, riftMat, 0, 0.015, 0.162, rightArmMesh, false);

            const pickaxe = createSolidVoxelPickaxe();
            // Securely anchor pickaxe inside the hand fist, pointing forward (+Z)
            pickaxe.position.set(0, -0.28, 0.1);
            pickaxe.rotation.x = THREE.MathUtils.degToRad(30); // natural forward hold angle
            rightArmMesh.add(pickaxe);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(-0.375, 1.35, 0);
            rightArmPivot.add(rightArmMesh);

            // 5. Legs -- original geometry and pivots retained, with robe details only.
            const leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), pantsMat);
            leftLegMesh.position.y = -0.375;
            leftLegMesh.castShadow = true;
            makeBox(0.17, 0.08, 0.035, runeMat, 0, -0.17, 0.145, leftLegMesh, false);

            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(0.13, 0.65, 0);
            leftLegPivot.add(leftLegMesh);

            const rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), pantsMat);
            rightLegMesh.position.y = -0.375;
            rightLegMesh.castShadow = true;
            makeBox(0.17, 0.08, 0.035, goldMatWizard, 0, -0.17, 0.145, rightLegMesh);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(-0.13, 0.65, 0);
            rightLegPivot.add(rightLegMesh);

            // Hierarchy Assembly -- unchanged.
            const bodyGroup = new THREE.Group();
            bodyGroup.add(headPivot);
            bodyGroup.add(torsoMesh);
            bodyGroup.add(backpack);
            bodyGroup.add(leftArmPivot);
            bodyGroup.add(rightArmPivot);
            bodyGroup.add(leftLegPivot);
            bodyGroup.add(rightLegPivot);

            // Original visual correction retained exactly.
            bodyGroup.rotation.y = Math.PI;

            character.add(bodyGroup);

            return {
                root: character,
                body: bodyGroup,
                headPivot: headPivot,
                eyeAnchor: eyeAnchor,
                headMesh: headMesh,
                hairBand: hairBand,
                torsoMesh: torsoMesh,
                backpack: backpack,
                leftArm: leftArmPivot,
                leftArmMesh: leftArmMesh,
                rightArm: rightArmPivot,
                rightArmMesh: rightArmMesh,
                leftLeg: leftLegPivot,
                rightLeg: rightLegPivot,
                pickaxe: pickaxe
            };
        }

        const player = createCharacterRig();
        scene.add(player.root);

        /* -------------------------------------------------------------
           CONTROLS & INPUT
        ------------------------------------------------------------- */
        const keys = {};
        let isFirstPerson = false;
        let isPointerLocked = false;
        let isSwinging = false;
        let swingTimer = 0;
        const SWING_DURATION = 0.22;

        let cameraPitch = 0;
        let cameraYaw = 0;
        let bodyYaw = 0;
        const MAX_HEAD_TURN = THREE.MathUtils.degToRad(65);

        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', () => document.body.requestPointerLock());

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = (document.pointerLockElement === document.body);
            blocker.style.display = isPointerLocked ? 'none' : 'flex';
        });

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyV') {
                isFirstPerson = !isFirstPerson;
                document.getElementById('cam-mode').innerText = isFirstPerson ? "1st Person [V]" : "3rd Person [V]";
                setFirstPersonMeshVisibility(isFirstPerson);
            }
        });

        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isPointerLocked && !isSwinging) {
                isSwinging = true;
                swingTimer = 0;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            const sens = 0.0022;
            cameraYaw -= e.movementX * sens;
            cameraPitch -= e.movementY * sens;
            cameraPitch = Math.max(-Math.PI / 2.05, Math.min(Math.PI / 2.05, cameraPitch));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // First person uses the real character rig rather than a detached
        // viewmodel. Only geometry that physically surrounds the eye point is hidden;
        // the torso, backpack, both arms, pickaxe and legs remain in their normal rig
        // positions and therefore appear naturally when the player looks down/sideways.
        function setFirstPersonMeshVisibility(fp) {
            player.headMesh.visible = !fp;
            player.hairBand.visible = !fp;

            player.torsoMesh.visible = true;
            player.backpack.visible = true;
            player.leftArmMesh.visible = true;
            player.rightArmMesh.visible = true;
            player.leftLeg.visible = true;
            player.rightLeg.visible = true;
        }

        /* -------------------------------------------------------------
           ANIMATION & KINEMATICS
        ------------------------------------------------------------- */
        const clock = new THREE.Clock();
        let walkTimer = 0;
        let swimTimer = 0;
        let verticalVelocity = 0;
        let isGrounded = true;

        function updateGame(delta) {
            const pos = player.root.position;
            const inWater = (pos.x > -10 && pos.x < 10 && pos.z > 6 && pos.z < 26);
            document.getElementById('water-state').innerText = inWater ? "Swimming Pool" : "Lush Land";
            document.getElementById('water-state').style.color = inWater ? "#38bdf8" : "#86efac";

            /* --- STRICT WASD VECTOR CALCULATION --- */
            // Camera horizontal forward and right vectors
            const camForwardX = -Math.sin(cameraYaw);
            const camForwardZ = -Math.cos(cameraYaw);
            const camRightX = Math.cos(cameraYaw);
            const camRightZ = -Math.sin(cameraYaw);

            let moveX = 0;
            let moveZ = 0;

            if (keys['KeyW'] || keys['ArrowUp']) {
                moveX += camForwardX;
                moveZ += camForwardZ;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                moveX -= camForwardX;
                moveZ -= camForwardZ;
            }
            if (keys['KeyD'] || keys['ArrowRight']) {
                moveX += camRightX;
                moveZ += camRightZ;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) {
                moveX -= camRightX;
                moveZ -= camRightZ;
            }

            const inputLengthSq = moveX * moveX + moveZ * moveZ;
            const isMoving = inputLengthSq > 0.0001;

            if (isMoving) {
                const len = Math.sqrt(inputLengthSq);
                moveX /= len;
                moveZ /= len;
            }

            const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
            const speed = inWater ? 3.2 : (isSprinting ? 6.8 : 4.0);

            // Apply movement displacement
            if (isMoving) {
                pos.x += moveX * speed * delta;
                pos.z += moveZ * speed * delta;
            }

            /* --- HEAD DECOUPLING & BODY ORIENTATION --- */
            if (isFirstPerson) {
                // First person: the head follows the view until its yaw limit is reached.
                // Past that limit, the body turns after it so the neck never over-rotates.
                let lookDiff = cameraYaw - bodyYaw;
                lookDiff = Math.atan2(Math.sin(lookDiff), Math.cos(lookDiff));

                if (Math.abs(lookDiff) > MAX_HEAD_TURN) {
                    const excess = lookDiff > 0
                        ? lookDiff - MAX_HEAD_TURN
                        : lookDiff + MAX_HEAD_TURN;
                    bodyYaw += excess * Math.min(1.0, delta * 10.0);

                    lookDiff = cameraYaw - bodyYaw;
                    lookDiff = Math.atan2(Math.sin(lookDiff), Math.cos(lookDiff));
                }

                player.headPivot.rotation.y = THREE.MathUtils.clamp(
                    lookDiff,
                    -MAX_HEAD_TURN,
                    MAX_HEAD_TURN
                );
                // Negative because the rig's local +X pitch sign is opposite the
                // cameraPitch convention used by the look vector below.
                player.headPivot.rotation.x = -cameraPitch;
            } else {
                if (isMoving) {
                    // Third person body follows movement, not the orbit camera.
                    const targetMoveAngle = Math.atan2(-moveX, -moveZ);
                    let angleDiff = targetMoveAngle - bodyYaw;
                    angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                    bodyYaw += angleDiff * Math.min(1.0, delta * 12.0);
                }

                // Third-person camera is fully independent: the character never turns
                // its head to follow the orbit camera, whether moving or standing still.
                player.headPivot.rotation.y = THREE.MathUtils.lerp(
                    player.headPivot.rotation.y,
                    0,
                    Math.min(1.0, delta * 12.0)
                );
                player.headPivot.rotation.x = THREE.MathUtils.lerp(
                    player.headPivot.rotation.x,
                    0,
                    Math.min(1.0, delta * 12.0)
                );
            }

            // bodyGroup already contains the one required 180° visual correction.
            // Keep the root rotation purely as gameplay heading; adding another PI here
            // reverses normal walking/running.
            player.root.rotation.y = bodyYaw;

            /* --- VERTICAL PHYSICS / SWIMMING --- */
            if (inWater) {
                isGrounded = false;
                if (keys['Space']) {
                    pos.y += 2.8 * delta;
                    if (pos.y > -0.2) pos.y = -0.2;
                } else if (keys['ShiftLeft']) {
                    pos.y -= 2.8 * delta;
                    if (pos.y < -1.4) pos.y = -1.4;
                } else {
                    pos.y = THREE.MathUtils.lerp(pos.y, -0.45 + Math.sin(clock.getElapsedTime() * 2.5) * 0.04, delta * 3);
                }
            } else {
                if (keys['Space'] && isGrounded) {
                    verticalVelocity = 8.5;
                    isGrounded = false;
                }
                verticalVelocity += -24 * delta;
                pos.y += verticalVelocity * delta;
                if (pos.y <= 0) {
                    pos.y = 0;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }

            pos.x = Math.max(-36, Math.min(36, pos.x));
            pos.z = Math.max(-36, Math.min(36, pos.z));

            /* --- ANIMATION CONTROLLER --- */
            let stateLabel = "IDLE";
            if (inWater) {
                stateLabel = isMoving ? "SWIMMING" : "TREADING WATER";
                swimTimer += delta * (isMoving ? 8.0 : 3.0);

                // The visual rig already has Y=PI so its face points along gameplay forward (-Z).
                // In Three.js' XYZ Euler composition, pitching this group NEGATIVE ~90°
                // lays the character face-down with the head (local +Y) pointing forward.
                // Positive ~90° produces the exact inverse: face-up and feet-first.
                const swimPitch = isMoving ? -Math.PI / 2.05 : 0.2;
                player.body.rotation.x = THREE.MathUtils.lerp(
                    player.body.rotation.x,
                    swimPitch,
                    Math.min(1.0, delta * 8)
                );

                player.leftArm.rotation.x = -Math.PI / 3 + Math.sin(swimTimer) * 0.9;
                player.leftArm.rotation.z = -0.3;
                if (!isSwinging) {
                    player.rightArm.rotation.x = -Math.PI / 3 + Math.sin(swimTimer + Math.PI) * 0.9;
                    player.rightArm.rotation.z = 0.3;
                }
                player.leftLeg.rotation.x = Math.sin(swimTimer * 1.6) * 0.4;
                player.rightLeg.rotation.x = -Math.sin(swimTimer * 1.6) * 0.4;

            } else {
                player.body.rotation.x = THREE.MathUtils.lerp(player.body.rotation.x, 0, delta * 10);

                if (isMoving && isGrounded) {
                    stateLabel = isSprinting ? "SPRINTING" : "WALKING";
                    const freq = isSprinting ? 14 : 9;
                    walkTimer += delta * freq;

                    const legAngle = Math.sin(walkTimer) * (isSprinting ? 0.9 : 0.65);
                    player.leftLeg.rotation.x = legAngle;
                    player.rightLeg.rotation.x = -legAngle;

                    player.leftArm.rotation.x = -legAngle * 0.8;
                    player.leftArm.rotation.z = 0.05;
                    if (!isSwinging) {
                        player.rightArm.rotation.x = legAngle * 0.8;
                        player.rightArm.rotation.z = -0.05;
                    }
                    player.body.position.y = Math.abs(Math.sin(walkTimer)) * 0.08;

                } else if (!isGrounded) {
                    stateLabel = "AIRBORNE";
                    player.leftLeg.rotation.x = -0.4;
                    player.rightLeg.rotation.x = 0.2;
                    player.leftArm.rotation.x = -0.5;
                    if (!isSwinging) player.rightArm.rotation.x = -0.5;
                } else {
                    stateLabel = "IDLE";
                    const idleTime = clock.getElapsedTime() * 2.2;
                    player.leftLeg.rotation.x = THREE.MathUtils.lerp(player.leftLeg.rotation.x, 0, delta * 8);
                    player.rightLeg.rotation.x = THREE.MathUtils.lerp(player.rightLeg.rotation.x, 0, delta * 8);
                    player.leftArm.rotation.x = THREE.MathUtils.lerp(player.leftArm.rotation.x, 0, delta * 8);
                    player.leftArm.rotation.z = 0.08 + Math.sin(idleTime) * 0.03;

                    if (!isSwinging) {
                        player.rightArm.rotation.x = THREE.MathUtils.lerp(player.rightArm.rotation.x, 0, delta * 8);
                        player.rightArm.rotation.z = -0.08 - Math.sin(idleTime) * 0.03;
                    }
                    player.body.position.y = Math.sin(idleTime) * 0.015;
                }
            }

            /* --- STRIKE / SWING ANIMATION --- */
            if (isSwinging) {
                swingTimer += delta;
                const progress = swingTimer / SWING_DURATION;
                if (progress <= 1.0) {
                    stateLabel += " + MINING";
                    const strike = Math.sin(progress * Math.PI);
                    player.rightArm.rotation.x = -Math.PI / 2.8 - strike * 1.5;
                    player.rightArm.rotation.y = -strike * 0.35;
                    player.rightArm.rotation.z = -strike * 0.2;
                } else {
                    isSwinging = false;
                    swingTimer = 0;
                    player.rightArm.rotation.y = 0;
                }
            }

            document.getElementById('anim-state').innerText = stateLabel;
        }

        /* -------------------------------------------------------------
           CAMERA SYSTEM
        ------------------------------------------------------------- */
        function updateCamera() {
            const headWorldPos = new THREE.Vector3();
            const eyeWorldPos = new THREE.Vector3();
            player.headPivot.getWorldPosition(headWorldPos);
            player.eyeAnchor.getWorldPosition(eyeWorldPos);

            if (isFirstPerson) {
                // True first-person placement: the camera is at the physical eye
                // anchor just in front of the face, never inside the head or torso.
                camera.position.copy(eyeWorldPos);

                const lookDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                ).normalize();

                camera.lookAt(camera.position.clone().add(lookDir));

            } else {
                // 3rd Person Orbit Follow Camera
                const camDistance = 3.8;
                const targetPoint = headWorldPos.clone().add(new THREE.Vector3(0, 0.30, 0));

                const cx = Math.sin(cameraYaw) * Math.cos(cameraPitch) * camDistance;
                const cy = -Math.sin(cameraPitch) * camDistance;
                const cz = Math.cos(cameraYaw) * Math.cos(cameraPitch) * camDistance;

                const desiredCamPos = new THREE.Vector3(
                    targetPoint.x + cx,
                    Math.max(0.1, targetPoint.y + cy),
                    targetPoint.z + cz
                );

                camera.position.lerp(desiredCamPos, 0.4);
                camera.lookAt(targetPoint);
            }
        }

        /* -------------------------------------------------------------
           RENDER LOOP
        ------------------------------------------------------------- */
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            updateGame(delta);
            updateCamera();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
